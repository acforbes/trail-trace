name: Deploy Trail-Trace Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**' # Only run if backend code changes

env:
  PROJECT_ID: trail-trace-513701
  PROJECT_NUMBER: "776453419964"
  GAR_LOCATION: us-central1
  GAR_REPO: artifact-registry-trail-trace
  GAR_SA: github-actions-sa
  GAR_POOL: github-pool
  GAR_PROVIDER: github-provider-trail-trace
  IMAGE_NAME: backend-trail-trace
  SERVICE_NAME: trail-trace-service

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.GAR_POOL }}/providers/${{ env.GAR_PROVIDER }}'
        service_account: '${{ env.GAR_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker \
        ${{ env.GAR_LOCATION }}-docker.pkg.dev \
        --quiet

    # - name: Docker Auth
    #   uses: docker/login-action@v3
    #   with:
    #     registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
    #     username: _json_key
    #     password: ${{ steps.auth.outputs.credentials_config_file }}

    - name: Build and Push Container
      uses: docker/build-push-action@v5
      with:
        context: ./backend # Set context strictly to your backend folder
        push: true
        tags: |
          ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:latest

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.GAR_LOCATION }}
        image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        flags: '--allow-unauthenticated'
        env_vars: |
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
