name: Deploy Frontend to Firebase

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  PROJECT_ID: trail-trace-513701
  PROJECT_NUMBER: "776453419964"
  GAR_LOCATION: us-central1
  GAR_REPO: artifact-registry-trail-trace
  GAR_SA: github-actions-sa
  GAR_POOL: github-pool
  GAR_PROVIDER: github-provider-trail-trace
  IMAGE_NAME: backend-trail-trace
  SERVICE_NAME: trail-trace-service

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.GAR_POOL }}/providers/${{ env.GAR_PROVIDER }}'
        service_account: '${{ env.GAR_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

    - name: Install Dependencies
      run: npm ci
      working-directory: ./frontend

    # Optional: If your React/Angular app needs the Cloud Run URL baked in during build time
    - name: Build Frontend
      run: npm run build
      working-directory: ./frontend
    #   env:
    #     REACT_APP_API_URL: https://run.app # Replace with your public Cloud Run URL
    #   env:
    #     # Vite requires the VITE_ prefix to expose variables to the browser
    #     VITE_API_URL: https://run.app

    # - name: Setup Firebase
    #   run: npm install -g firebase-tools

    - name: Deploy to Firebase Hosting
      run: npx firebase-tools deploy --only hosting --project ${{ env.PROJECT_ID }}
      working-directory: ./frontend
