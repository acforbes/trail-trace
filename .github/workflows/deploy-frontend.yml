name: Deploy Frontend to Firebase

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**' # Only run if frontend code changes

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Dependencies
      run: npm ci
      working-directory: ./frontend

    # Optional: If your React/Angular app needs the Cloud Run URL baked in during build time
    - name: Build Frontend
      run: npm run build
      working-directory: ./frontend
    #   env:
    #     REACT_APP_API_URL: https://run.app # Replace with your public Cloud Run URL
      env:
        # Vite requires the VITE_ prefix to expose variables to the browser
        VITE_API_URL: https://run.app

    # - name: Deploy to Firebase Hosting
    #   uses: FirebaseExtended/action-hosting-deploy@v0
    #   with:
    #     repoToken: ${{ secrets.GITHUB_TOKEN }}
    #     firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUR_PROJECT }}
    #     projectId: your-gcp-project-id
    #     channelId: live # Deploys straight to production

    - name: Deploy to Firebase Hosting
      run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_CLI_TOKEN }}"
