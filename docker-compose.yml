version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: trail-trace-backend:local
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - ALLOWED_ORIGINS=http://localhost:5173
    volumes:
      - ./backend/app:/code/app  # Live reload backend changes
    restart: unless-stopped
    # Override the production Cloud Run command for local development:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

